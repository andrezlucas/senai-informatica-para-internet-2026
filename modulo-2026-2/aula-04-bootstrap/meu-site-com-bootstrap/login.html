<body class="d-flex flex-column min-vh-100">

    <header style="background-color: #002b5b;" class="p-3 shadow-sm">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start"> 
                <a href="index.html" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
                    <img src="img/senai-logo.png" width="190" alt="Logo senai">
                </a>
                <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
                    <li><a href="index.html" class="nav-link px-2 text-white fs-5">Início</a></li>

    <main class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">
        
        <form style="max-width: 500px; width: 100%;" class="bg-white p-5 rounded-4 shadow">
            
            <h2 class="text-center fw-bold mb-4 text-dark">Área de Login</h2>

            <div class="mb-4">
                <label for="exampleInputEmail1" class="form-label fw-semibold fs-5">Endereço de e-mail</label>
           
                <input type="email" class="form-control form-control-lg" id="exampleInputEmail1" placeholder="Escreva seu e-mail">
            </div>
            
            <div class="mb-4">
                <label for="exampleInputPassword1" class="form-label fw-semibold fs-5">Senha</label>
               
                <input type="password" class="form-control form-control-lg" id="exampleInputPassword1" placeholder="Escreva sua senha">
            </div>
            
            <div class="d-grid gap-2 mt-4">
              
                <button type="submit" class="btn btn-primary btn-lg fw-bold" style="background-color: #002b5b";>Entrar</button>
            </div>
        </form>
    </main>

    <footer style="background-color: #FF8C27;" class="text-white py-4 mt-auto">
