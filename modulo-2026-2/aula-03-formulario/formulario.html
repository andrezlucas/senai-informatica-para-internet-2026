<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Formulário de Cadastro</h1>
    <form action="" method="post" enctype="multipart/form-data">

        <!-- enctype é um atributo usado na tag <form> que informa que o formulário aceita arquivos, como imagens,PDFS, documentos etc-->

        <!-- DADOS PESSOAIS-->

        <fieldset> <!--o fieldset cria esse quadrado ao redor-->
            <legend><!--Adiciona uma linha de "legenda" de texto-->
                Dados Pessoais
            </legend>

            <!--a parte de id e name serve para futuramente o uso de banco de dados-->
            <label for="nome">Nome Completo:</label><br>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" maxlength="100" required>
            <br><br>

            <label for="email">E-mail</label> <br>
            <input type="email" id="email" name="email" placeholder="exemplo@gmail.com" required>
            <br><br>

            <label for="senha">Senha</label> <br>
            <input type="password" id="senha" name="senha" placeholder="Escreva sua senha" minlength="8" maxlength="20">

            <br><br>

            <label for="cpf">CPF</label> <br>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00"
                pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" maxlength="11">
            <br><br>
<!--o pattern significa padronizar-->

            <label for="Telefone">Número de Telefone</label> <br>
            <input type="tel" id="telefone" name="telefone" placeholder="(xx)9xxxx-xxxx"
                pattern="55[1-9]{2}(?:9[0-9]{8}[2-9][0-9]{7})">
        </fieldset>
        <br><br>

        <!--Informações Acadêmicas-->
        <fieldset>

            <legend>
                Informações Acadêmicas
            </legend>
            <label for="curso">Curso</label> <br>
            <select name="curso" id="curso" required>

                <option value="">Selecione um curso</option>
                <option value="ads">Análise e Desenvolvimento de Sistemas</option>
                <option value="redes">Redes de Computadores</option>
                <option value="informatica">Informática</option>
                <option value="web">Desenvolvimento Web</option>

            </select>
            <br><br>

            <p>Turno</p>
            <label for="manha">Manhã</label>
            <input type="radio" id="manha" name="turno" value="manha">

            <br>

            <label for="tarde">Tarde</label>
            <input type="radio" id="tarde" name="turno" value="tarde">
            <br>

            <label for="noite">Noite</label>
            <input type="radio" id="noite" name="turno" value="noite">

            <br><br>

            <label for="semestre">Semestre</label><br>
            <input type="number" id="semestre" name="semestre" min="1" max="10" step="1" value="1">
        </fieldset>
        <br><br>

        <!--Preferências-->
        <fieldset>

            <legend>
                Preferências Tecnológicas
            </legend>

            <p>Quais são as tecnologias que você conhece?
            </p>
            <input type="checkbox" name="html" id="html" value="html">
            <label for="html">HTML5</label>

            <br>

            <input type="checkbox" name="css" id="css" value="css">
            <label for="css">CSS</label>

            <br>

            <input type="checkbox" name="javascript" id="javascript" value="javascript">

            <label for="javascript">JavaScript</label>

            <br>

            <input type="checkbox" name="python" id="python" value="python">
            <label for="python">Python</label>

            <br>

            <input type="checkbox" name="java" id="java" value="java">
            <label for="java">Java</label>

            <br><br>

            <label for="nivel">Nivel de conhecimento em programação</label><br> <br>
            <input type="range" id="nivel" name="nivel" min="0" max="10" step="1" value="10">


        </fieldset>
        <br><br>

        <!--DATAS E HORÁRIOS-->

        <fieldset>
            <legend>Datas e Horários</legend><br>

            <label for="nascimento">Data de nascimento</label><br><br>
            <input type="date" id="nascimento" name="nascimento"><br><br>

            <label for="horario">Horário Preferencial</label><br><br>
            <input type="time" id="horario" name="horario"><br><br>

            <label for="agendamento">Data e hora do atendimento</label><br>
            <input type="datetime-local" id="agendamento" name="agendamento">
            <br><br>

            <label for="mes">Mês de conclusão do curso</label><br>
            <input type="month" id="mes" name="mes">
            <br><br>

            <label for="semana">Semana do projeto</label><br>
            <input type="week" id="semana" name="semana">
            <br><br>

        </fieldset>


        <!--PESQUISA E LINKS-->
        <fieldset>

            <legend>Pesquisa e Links</legend><br>
            <label for="pesquisa">Pesquisar Tecnologia</label><br>
            <input type="search" id="pesquisa" name="pesquisa" placeholder="Digite uma tecnologia"><br><br>

            <label for="site">Site Pessoal</label><br>
            <input type="url" id="site" name="site" placeholder="https://www.exemplo.com"><br><br>

            <label for="linguagem">Linguagem de programação preferida</label><br>
            <input list="linguagens" id="linguagem" name="linguagem" placeholder="Digite ou selecione">

            <datalist id="linguagens">
                <option value="Python">
                <option value="Java">
                <option value="C#">
                <option value="PHP">
                <option value="Typescript">

            </datalist>

        </fieldset>

        <!--CONFIGURAÇÕES-->
        <fieldset>
            <legend>Configurações</legend>

            <label for="cor">Cor preferida</label><br>
            <input type="color" id="cor" name="cor" value="#00000">
            <br><br>

            <label for="arquivo">Enviar Currículo</label><br>
            <input type="file" id="arquivo" name="arquivo" accept=".pdf,.doc,.docx">
            <br><br>

            <label for="idade">Idade</label><br>
            <input type="number" id="idade" name="idade" min="14" max="100">


        </fieldset>

        <!--SOBRE VOCÊ-->
        <fieldset>
            <legend>Sobre Você</legend>
            <label for="sobre">Conte um pouco sobre sua experiência com tecnologia:</label>
            <br>

            <textarea name="sobre" id="sobre" rows="8" cols="50" maxlength="500"
                placeholder="Digite aqui sua experiência"></textarea>
        </fieldset>

        <!--ACEITE-->
        <fieldset>
            <legend>Termos</legend>
            <input type="checkbox" id="termos" name="termos" value="aceito" required>
            <label for="termos">Declaro que as informações fornecidas são verdadeiras</label>
        </fieldset>

        <!--BOTÕES-->
        <br>
        <section>
            <input type="submit" value="Enviar formulário">
            <input type="reset" value="Limpar formulário">
            <button type="button">Botão sem ação</button>
        </section>
    </form>
</body>

</html>
