<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <header>
        <h1>Introdução ao CSS</h1>
        <h2>Criando Formulário</h2>
        
    </header>

    <main>



        <fieldset>

            <form action="" method="post" enctype=""></form>
            <legend>Dados Pessoais:</legend>
            <label for="nome">Nome:</label>
            <input type="text" name="nome" id="nome" placeholder="Nome completo">
            <br><br>
            <label for="data">Data de nasc.</label>
            <input type="date" name="data" id="data"><br><br>

            <label for="cpf">CPF:</label>
            <input type="text" name="cpf" id="cpf" placeholder="Escreva seu cpf"
                pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"><br><br>

            <label for="rg">RG:</label>
            <input type="text" name="rg" id="rg" placeholder="Escreva seu RG"><br><br>

            <label for="email">E-mail:</label>
            <input type="email" name="email" id="email" placeholder="Escreva seu E-mail"><br><br>

            <label for="linkedin">Linkedin:</label>
            <input type="text" name="linkedin" id="linkedin" placeholder="Escreva seu Linkedin"><br><br>

            <button type="submit">ENVIAR</button>
            <button type="reset">LIMPAR</button>

            </form>





        </fieldset>









    </main>

</body>

</html>
